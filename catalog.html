    /* ── CATALOG LAYOUT ── */
    .catalog-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: var(--sp-xl);
      align-items: start;
    }
    @media (min-width: 1024px) {

    /* ── SIDEBAR ── */
    #catalog-sidebar {
      background: var(--white);
      border-radius: var(--radius-lg);
      border: 1px solid var(--gray-100);
      padding: var(--sp-lg);
      box-shadow: var(--shadow-sm);
      position: sticky;
      top: calc(var(--nav-h) + 16px);
    }

    /* Mobile: sidebar as drawer */
    @media (max-width: 1023px) {
      #catalog-sidebar {
        position: fixed;
        top: 0; left: 0; bottom: 0;
        width: 300px;
        max-width: 90vw;
        z-index: 1050;
        border-radius: 0;
        overflow-y: auto;
        transform: translateX(-100%);
        transition: transform var(--dur-mid) var(--ease-out);
        padding-top: calc(var(--nav-h) + var(--sp-md));
      }
      #catalog-sidebar.sidebar--open {
        transform: translateX(0);
      }
    }

    /* Overlay */
    #sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(10,22,40,0.5);
      z-index: 1040;
      backdrop-filter: blur(2px);
    }
    #sidebar-overlay.overlay--show { display: block; }

    /* ── SIDEBAR NAV ITEMS ── */
    #sidebar-nav { display: flex; flex-direction: column; gap: 2px; }

    .sf-item {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 9px 12px;
      border-radius: var(--radius-md);
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-body);
      background: transparent;
      border: none;
      cursor: pointer;
      transition: all var(--dur-fast);
      text-align: left;
    }
    .sf-item:hover { background: var(--off-white); color: var(--navy); }
    .sf-item--active { background: rgba(84,185,130,0.1); color: var(--teal); font-weight: 700; }

    .sf-item__icon { font-size: 1rem; flex-shrink: 0; }
    .sf-item__label { flex: 1; }
    .sf-item__count {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--text-light);
      background: var(--gray-100);
      padding: 2px 7px;
      border-radius: var(--radius-full);
      flex-shrink: 0;
    }
    .sf-item--active .sf-item__count { background: rgba(84,185,130,0.15); color: var(--teal); }

    .sf-item__chevron {
      flex-shrink: 0;
      transition: transform var(--dur-fast);
      color: var(--gray-300);
    }
    .sf-group--open .sf-item__chevron { transform: rotate(180deg); }

    /* Sub items */
    .sf-subs {
      display: none;
      flex-direction: column;
      gap: 1px;
      padding-left: 28px;
      margin-top: 2px;
    }
    .sf-group--open .sf-subs { display: flex; }

    .sf-sub {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 7px 10px;
      border-radius: var(--radius-md);
      font-size: 0.8125rem;
      color: var(--text-light);
      background: transparent;
      border: none;
      cursor: pointer;
      transition: all var(--dur-fast);
      text-align: left;
    }
    .sf-sub:hover { background: var(--off-white); color: var(--navy); }
    .sf-sub--active { color: var(--teal); font-weight: 600; }
    .sf-sub__dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--gray-300);
      flex-shrink: 0;
      transition: background var(--dur-fast);
    }
    .sf-sub--active .sf-sub__dot { background: var(--teal); }
    .sf-sub .sf-item__count { margin-left: auto; }

    /* ── FILTER TRAIL ── */
    #filter-trail {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: var(--sp-md);
      min-height: 28px;
    }
    .filter-trail__chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: var(--radius-full);
      font-size: 0.75rem;
      font-weight: 600;
      background: rgba(84,185,130,0.1);
      color: var(--teal);
      border: 1px solid rgba(84,185,130,0.25);
      cursor: pointer;
      transition: all var(--dur-fast);
    }
    .filter-trail__chip:hover { background: rgba(84,185,130,0.2); }

    #mobile-filter-btn {

      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: var(--radius-full);
      background: var(--navy);
      color: var(--white);
      font-size: 0.875rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
      flex-shrink: 0;
    }
    @media (min-width: 1024px) { #mobile-filter-btn { display: none; } }

    /* ── SIDEBAR CLOSE (mobile) ── */
    #sidebar-close-btn {

      top: var(--sp-md);
